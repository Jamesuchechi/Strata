<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradients for the 3 layered Strata crystal facets -->
    <linearGradient id="strata-top-surface" x1="16" y1="16" x2="84" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0061FE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="strata-top-inner" x1="30" y1="23" x2="70" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="strata-mid-surface" x1="16" y1="36" x2="84" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="strata-bot-surface" x1="16" y1="56" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="70%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="strata-glow" x1="50" y1="10" x2="50" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0061FE" stop-opacity="0" />
    </linearGradient>

    <filter id="strata-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0061FE" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="50" cy="50" r="40" fill="url(#strata-glow)" />

  <g filter="url(#strata-shadow)">
    <!-- LAYER 3 (BOTTOM STRATUM) -->
    <!-- Edge Bevels -->
    <path d="M 16 72 L 50 88 L 50 94 L 16 78 Z" fill="#0C4A6E" />
    <path d="M 50 88 L 84 72 L 84 78 L 50 94 Z" fill="#082F49" />
    <!-- Top Face -->
    <path d="M 50 56 L 84 72 L 50 88 L 16 72 Z" fill="url(#strata-bot-surface)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="0.75" />

    <!-- LAYER 2 (MIDDLE STRATUM) -->
    <!-- Edge Bevels -->
    <path d="M 16 52 L 50 68 L 50 74 L 16 58 Z" fill="#075985" />
    <path d="M 50 68 L 84 52 L 84 58 L 50 74 Z" fill="#0369A1" />
    <!-- Top Face -->
    <path d="M 50 36 L 84 52 L 50 68 L 16 52 Z" fill="url(#strata-mid-surface)" stroke="#7DD3FC" stroke-opacity="0.4" stroke-width="0.75" />

    <!-- LAYER 1 (TOP STRATUM) -->
    <!-- Edge Bevels -->
    <path d="M 16 32 L 50 48 L 50 54 L 16 38 Z" fill="#0284C7" />
    <path d="M 50 48 L 84 32 L 84 38 L 50 54 Z" fill="#0052D4" />
    <!-- Top Face -->
    <path d="M 50 16 L 84 32 L 50 48 L 16 32 Z" fill="url(#strata-top-surface)" stroke="#BAE6FD" stroke-opacity="0.7" stroke-width="1" />
    <!-- Inner Glass Facet Diamond -->
    <path d="M 50 22 L 74 32 L 50 42 L 26 32 Z" fill="url(#strata-top-inner)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.75" />
  </g>
</svg>
