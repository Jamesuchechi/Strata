[project]
name = "strata-sdk"
version = "0.1.0"
description = "Python SDK & CLI for Strata: The AI-Native Data Science Studio & Version Control System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
strata = "strata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
