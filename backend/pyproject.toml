[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.14.0",
    "arq>=0.26.1",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "boto3>=1.35.0",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "fastexcel>=0.21.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "polars>=1.14.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.17",
    "redis>=5.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
strata-api = "strata_api.main:start"
strata = "strata_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_api", "src/strata_sdk", "src/strata_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
